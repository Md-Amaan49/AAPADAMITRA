# ==============================================================================
# AAPADAMITRA — Render Blueprint Infrastructure as Code (render.yaml)
# Unified Deployment Specification: Web Service (NestJS) + Static Site (Vite React) + PostgreSQL
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API Service (NestJS + Prisma + Multi-Hazard Model Gateway)
  # ----------------------------------------------------------------------------
  - type: web
    name: aapadamitra-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install && pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: API_GLOBAL_PREFIX
        value: /api/v1
      - key: CORS_ORIGIN
        value: "*"
      - key: AI_MODEL_API_BASE_URL
        value: https://aapadamitra-model-api.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aapadamitra-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Application (React + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: aapadamitra-web
    runtime: static
    buildCommand: corepack enable && pnpm install && pnpm run build:web
    staticPublishPath: ./apps/web/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        value: https://aapadamitra-api.onrender.com/api/v1

databases:
  # ----------------------------------------------------------------------------
  # 3. PostgreSQL Database with PostGIS Capability
  # ----------------------------------------------------------------------------
  - name: aapadamitra-db
    databaseName: aapadamitra
    user: aapadamitra_user
    plan: free
    region: oregon

